name: Backend CI

# Тесты и линтеры backend: CONTRIBUTION.md §10 (pytest на все эндпоинты),
# §11 (black/ruff) и §15 («Есть тесты, CI зелёный»).
# Отдельный workflow: docker-image.yml проверяет сборку и запуск контейнеров,
# а этот — контракт API и работу с настоящей PostgreSQL.

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.11 + PostgreSQL 15)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Реальная PostgreSQL для DB-тестов. tests/conftest.py пропускает их,
    # если TEST_DATABASE_URL недоступен, поэтому сервис обязателен:
    # без него в CI прогонялась бы только половина набора.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recipes_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recipes_test
      JWT_SECRET: ci-jwt-secret-not-for-production-use
      AUTO_INIT_SCHEMA: "true"
      EMBEDDINGS_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # conftest.py молча скипает DB-тесты при недоступной базе, поэтому
      # соединение проверяем явно: иначе job станет «зелёным» без них.
      - name: Verify the test database is reachable
        run: |
          python -c "import os, psycopg2; connection = psycopg2.connect(os.environ['TEST_DATABASE_URL'], connect_timeout=5); connection.close(); print('PostgreSQL is reachable')"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      # Задача 6.0/6.2: обучение модели на корпусе из репозитория и критерий приёмки —
      # python -m app.ml.evaluate возвращает 1, если v1 не лучше baseline по P@5 и MRR.
      # Ни сети, ни датасета не нужно: корпус и артефакт собираются локально.
      - name: Train the recommendation model and check the ranking metrics
        run: |
          python -m app.ml.model --out /tmp/v1.json
          python -m app.ml.evaluate --model /tmp/v1.json

      # Задача 7 спринта 2: тот же прогон под coverage (statement + branch, порог 80 %
      # из backend/pyproject.toml). coverage report возвращает 1, если порог не достигнут,
      # поэтому просадка покрытия ломает CI, а не остаётся незамеченной.
      - name: Run the test suite with coverage
        run: |
          coverage run -m pytest
          coverage report
