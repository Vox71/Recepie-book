openapi: 3.0.3
info:
  title: Recipe App API
  version: 1.0.0
  description: >
    API Flask-приложения для рецептов, холодильника, аллергий/предпочтений,
    JWT-авторизации и уведомлений о просроченных продуктах.
  servers:
  - url: http://localhost:${BACKEND_PORT:-8000}
    description: Backend (Docker)
tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Recipes
  - name: Favorites
  - name: Fridge
  - name: Notifications
  - name: Recommendations

paths:
  /:
    get:
      tags: [System]
      summary: Проверка работы API
      responses:
        '200':
          description: Приветствие
          content:
            text/plain:
              schema:
                type: string
                example: Welcome to the recipe app!

  /health:
    get:
      tags: [System]
      summary: Liveness-проба (без обращения к БД)
      responses:
        '200':
          description: Приложение работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [System]
      summary: Readiness-проба (проверка соединения с БД)
      responses:
        '200':
          description: Приложение готово принимать трафик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'

  /register:
    post:
      tags: [Auth]
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Ошибка валидации или дубликат пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /login:
    post:
      tags: [Auth]
      summary: Вход пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Не переданы email или password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /protected:
    get:
      tags: [Auth]
      summary: Проверка JWT-токена
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Доступ разрешён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResponse'
        '401':
          description: Токен отсутствует или недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user_preferences:
    post:
      tags: [Users]
      summary: Добавить аллергии и предпочтения пользователя
      description: >
        В текущей реализации user_id передаётся в теле запроса.
        Защита токеном для этого маршрута не применяется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesRequest'
      responses:
        '200':
          description: Аллергии и предпочтения добавлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /recipes:
    get:
      tags: [Recipes]
      summary: Получить страницу рецептов
      description: >
        Список отдаётся страницами (CONTRIBUTION.md §4): limit — размер страницы
        (по умолчанию 50, максимум 200), offset — сколько записей пропустить
        (по умолчанию 0). Порядок стабильный — по возрастанию id.
      parameters:
        - name: limit
          in: query
          required: false
          description: Размер страницы
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Сколько записей пропустить
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        '200':
          description: Страница рецептов (пустой массив, если offset больше числа записей)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
        '400':
          description: limit или offset не целое число либо вне допустимого диапазона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Recipes]
      summary: Добавить новый рецепт
      description: >
        В коде декоратор token_required закомментирован, поэтому авторизация
        фактически не требуется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
      responses:
        '201':
          description: Рецепт добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /recipes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags: [Recipes]
      summary: Получить рецепт по ID
      responses:
        '200':
          description: Рецепт найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '404':
          description: Рецепт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Recipes]
      summary: Обновить рецепт по ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
      responses:
        '200':
          description: Рецепт обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

    delete:
      tags: [Recipes]
      summary: Удалить рецепт по ID
      responses:
        '200':
          description: Рецепт удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /favorite_recipes:
    get:
      tags: [Favorites]
      summary: Получить страницу избранных рецептов
      description: >
        Избранное текущего пользователя: user_id берётся только из токена, передать его
        в запросе нельзя. Список отдаётся страницами (CONTRIBUTION.md §4): limit — размер
        страницы (по умолчанию 50, максимум 200), offset — сколько записей пропустить.
        Порядок — от новых к старым (favorite_recipes.created_at), при равных метках —
        по убыванию favorite_recipes.id.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Размер страницы
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Сколько записей пропустить
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        '200':
          description: Страница избранных рецептов (пустой массив, если избранного нет)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
        '400':
          description: limit или offset не целое число либо вне допустимого диапазона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Токен не передан, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Favorites]
      summary: Добавить рецепт в избранное
      description: >
        Повторное добавление идемпотентно: пара (user_id, recipe_id) уникальна
        (favorite_recipes_user_recipe_key), поэтому дубль не создаётся и ответ в этом
        случае тоже 201 — с сообщением «уже в избранном». Поле user_id в теле
        игнорируется: пользователь всегда берётся из токена.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteInput'
      responses:
        '201':
          description: Рецепт добавлен (или уже был в избранном)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Тело не объект или recipe_id не целое положительное число
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Токен не передан, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Рецепт с таким id не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /favorite_recipes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор рецепта (recipes.id)
        schema:
          type: integer
          format: int64

    delete:
      tags: [Favorites]
      summary: Убрать рецепт из избранного
      description: >
        Удаляется только запись текущего пользователя. Избранное другого пользователя
        для него не существует, поэтому ответ — 404, а не 403: наличие чужой записи
        не раскрывается.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Рецепт убран из избранного
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Токен не передан, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Рецепта нет в избранном текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notify_expired:
    get:
      tags: [Notifications]
      summary: Уведомить о просроченных продуктах текущего пользователя
      description: >
        Просроченным считается продукт, у которого expiration_date меньше текущей даты
        базы данных (CURRENT_DATE); продукт со сроком «сегодня» ещё годен. Это же
        правило использует DELETE /delete_expired_products, поэтому отчёт и удаление
        всегда совпадают.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Уведомление отправлено или просроченных продуктов нет
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NotifyExpiredResponse'
                  - $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /delete_expired:
    delete:
      tags: [Notifications]
      summary: Удалить просроченные продукты текущего пользователя
      description: >
        Удаляются только продукты со сроком меньше текущей даты базы данных
        (CURRENT_DATE); продукт со сроком «сегодня» остаётся. Повторный вызов
        безопасен: он удаляет 0 продуктов.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Количество удалённых продуктов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteExpiredResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /suggest_recipes:
    get:
      tags: [Recommendations]
      summary: Предложить рецепты с просроченными продуктами
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список предложенных рецептов или сообщение
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SuggestRecipesResponse'
                  - $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /fridge_items:
    get:
      tags: [Fridge]
      summary: Получить страницу продуктов из fridge_items
      description: >
        Возвращает продукты всех пользователей, без фильтрации по токену. Список
        отдаётся страницами (CONTRIBUTION.md §4): limit — размер страницы (по умолчанию
        50, максимум 200), offset — сколько записей пропустить (по умолчанию 0).
        Порядок стабильный — по expiration_date, затем по item_id.
      parameters:
        - name: limit
          in: query
          required: false
          description: Размер страницы
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Сколько записей пропустить
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        '200':
          description: Страница продуктов (пустой массив, если offset больше числа записей)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FridgeItem'
        '400':
          description: limit или offset не целое число либо вне допустимого диапазона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Fridge]
      summary: Добавить продукты в холодильник
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FridgeItemInput'
      responses:
        '201':
          description: Продукты добавлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /delete_expired_products:
    delete:
      tags: [Fridge]
      summary: Удалить все просроченные продукты из fridge_items
      description: >
        Удаляет просроченные продукты всех пользователей, а не только текущего.
        Просроченным считается продукт, у которого expiration_date меньше текущей даты
        базы данных (CURRENT_DATE); продукт со сроком «сегодня» ещё годен. Правило
        общее с GET /notify_expired, повторный вызов удаляет 0 продуктов.
      responses:
        '200':
          description: Просроченные продукты удалены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /recommend_recipes:
    get:
      tags: [Recommendations]
      summary: Рекомендовать рецепты по холодильнику, аллергиям и предпочтениям
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Рекомендованные рецепты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendRecipesResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          example: ready
        database:
          type: string
          example: ok

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 120
        password:
          type: string
          format: password
          minLength: 8
        allergies:
          type: string
          nullable: true
          description: >-
            Термины через запятую. В БД хранится как users.allergies (text) и
            отдельными строками в user_allergy_preferences.
        preferences:
          type: string
          nullable: true
          description: Термины через запятую; в БД хранится как users.preferences (text).

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        user_id:
          type: integer

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT-токен, срок жизни 12 часов

    ProtectedResponse:
      type: object
      properties:
        message:
          type: string
        user_id:
          type: string

    UserPreferencesRequest:
      type: object
      properties:
        user_id:
          type: integer
        allergies:
          type: array
          items:
            type: string
        preferences:
          type: array
          items:
            type: string

    Ingredient:
      type: object
      description: >
        Одна строка recipe_ingredients: нормализованное название продукта и количество
        текстом, в порядке sort_order (его пишет импортёр датасета povarenok).
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
          description: Колонка recipe_ingredients.ingredient_name (varchar(200)).
        quantity:
          type: string
          maxLength: 100
          nullable: true
          description: >
            Колонка recipe_ingredients.quantity_text (varchar(100)); null, если в
            источнике количество не указано (например, «соль» без граммовки).

    Recipe:
      type: object
      description: >
        Рецепт в ответе. Все поля присутствуют всегда; null допустим только там, где это
        указано в описании поля: импортированный рецепт не имеет инструкции, сложности и
        источника, а ручной рецепт не имеет source_url и строк recipe_ingredients.
      required:
        [id, name, ingredients, ingredient_list, instructions, difficulty_level, source_url]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 200
          description: Колонка recipes.recipe_name (varchar(200)).
        ingredients:
          type: string
          maxLength: 10000
          description: >
            Колонка recipes.ingredients (text) — тот же список текстом, «продукт —
            количество» через запятую. Импортированный рецепт получает текст, собранный
            импортёром из recipe_ingredients, ручной — то, что передал клиент.
        ingredient_list:
          type: array
          description: >
            Нормализованные строки recipe_ingredients в порядке sort_order — по ним
            работает фильтр аллергенов. Пустой массив у рецептов, созданных через
            POST /recipes: структурные строки пишет только импортёр датасета.
          items:
            $ref: '#/components/schemas/Ingredient'
        instructions:
          type: string
          maxLength: 10000
          nullable: true
          description: >
            Колонка recipes.instruction (text, не varchar(100) из диаграммы).
            null у рецептов, импортированных из povarenok: в датасете нет инструкций.
        difficulty_level:
          type: string
          maxLength: 50
          nullable: true
          description: >
            Колонка recipes.difficulty_level (varchar(50)). null у импортированных
            рецептов: в датасете нет сложности.
        source_url:
          type: string
          maxLength: 255
          nullable: true
          description: >
            Колонка recipes.source_url (varchar(255)) — естественный ключ импорта и
            ссылка на источник рецепта. null у рецептов, созданных через POST /recipes.

    RecipeInput:
      type: object
      required: [name, ingredients, instructions, difficulty_level]
      properties:
        name:
          type: string
          maxLength: 200
        ingredients:
          type: string
        instructions:
          type: string
          maxLength: 10000
        difficulty_level:
          type: string
          maxLength: 50

    FavoriteInput:
      type: object
      required: [recipe_id]
      properties:
        recipe_id:
          type: integer
          minimum: 1
          description: Идентификатор рецепта (recipes.id); владелец берётся из токена.

    FridgeItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        product_name:
          type: string
        expiration_date:
          type: string
          format: date
        quantity:
          type: integer
        last_added:
          type: string
          format: date-time

    FridgeItemInput:
      type: object
      required: [user_id, product_name, expiration_date, quantity]
      properties:
        user_id:
          type: integer
        product_name:
          type: string
          maxLength: 100
        expiration_date:
          type: string
          format: date
        quantity:
          type: integer
          minimum: 1
          description: Колонка fridge_items.quantity (integer, CHECK (quantity > 0)).

    NotifyExpiredResponse:
      type: object
      properties:
        message:
          type: string
        expired_products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              expiration_date:
                type: string
                format: date

    DeleteExpiredResponse:
      type: object
      properties:
        message:
          type: string

    SuggestRecipesResponse:
      type: object
      properties:
        message:
          type: string
        recipes:
          type: array
